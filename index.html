<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapTap Scorebord</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>🎯 MapTap Scorebord</h1>
        <p id="subtitle">Laden…</p>
      </div>
      <div class="top-actions">
        <nav class="tabs nav" aria-label="Pagina's">
          <a href="index.html" aria-current="page">📊 Scorebord</a>
          <a href="kaart.html">🌍 Kaart</a>
        </nav>
        <a class="btn primary-link" id="form-link" href="https://docs.google.com/forms/d/e/1FAIpQLSeYSUEAxbxAwryLA-4SiXtxM5MdXwAJ_mon7DEaT60UFioa7w/viewform" target="_blank" rel="noopener">✍️ Score invullen</a>
        <a class="btn" id="admin-link" href="beheer.html" hidden>✏️ Scores invoeren</a>
      </div>
    </header>
    <div class="sheet-notes" id="sheet-notes" hidden></div>
    <div class="card shame" id="shame" hidden></div>

    <section>
      <h2>Klassement</h2>
      <div class="card table-wrap" id="standings"></div>
    </section>

    <section>
      <h2>Hoogtepunten</h2>
      <div class="kpis" id="kpis"></div>
    </section>

    <section>
      <h2>Dagresultaat</h2>
      <div class="card" id="day"></div>
    </section>

    <section>
      <h2>Top 5 moeilijkste locaties</h2>
      <div class="card table-wrap" id="locations"></div>
    </section>

    <section>
      <h2>Verloop</h2>
      <div class="card">
        <div class="tabs" role="tablist" id="trend-tabs">
          <button role="tab" aria-selected="true" data-mode="score">Score per dag</button>
          <button role="tab" aria-selected="false" data-mode="wins">Wins opgeteld</button>
        </div>
        <div class="legend" id="trend-legend"></div>
        <div class="chart" id="trend"></div>
      </div>
    </section>

    <section>
      <h2>Rondes</h2>
      <div class="card">
        <div class="tabs" role="tablist" id="heat-tabs">
          <button role="tab" aria-selected="true" data-mode="avg">Gemiddelde score</button>
          <button role="tab" aria-selected="false" data-mode="lost">Punten verloren</button>
        </div>
        <div id="heat"></div>
      </div>
    </section>

    <section>
      <h2>Archief</h2>
      <div class="card list" id="archive"></div>
    </section>
  </div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
